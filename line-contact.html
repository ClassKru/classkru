<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ติดต่อ ClassKru ผ่าน LINE</title>
  <meta name="description" content="สอบถาม แจ้งปัญหา หรือขอคำแนะนำการใช้งาน ClassKru ผ่าน LINE Official Account">
  <link rel="canonical" href="https://www.classkru.com/line-contact.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ClassKru">
  <meta property="og:locale" content="th_TH">
  <meta property="og:title" content="ติดต่อ ClassKru ผ่าน LINE">
  <meta property="og:description" content="สอบถาม แจ้งปัญหา หรือขอคำแนะนำการใช้งาน ClassKru ผ่าน LINE Official Account">
  <meta property="og:url" content="https://www.classkru.com/line-contact.html">
  <meta property="og:image" content="https://www.classkru.com/logo.png?v=2">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="โลโก้ ClassKru">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#1d9e75;--pk:#0f6e56;--pbg:#f0fdf4;--pbd:#86efac;
      --bg:#f5f7fa;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e8edf2;
      --sh:0 1px 4px rgba(0,0,0,.06);--sh-md:0 4px 16px rgba(0,0,0,.10);
      --tr:all .18s cubic-bezier(.4,0,.2,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text)}
    body{display:grid;place-items:center;padding:24px}
    .contact-card{width:min(100%,440px);background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-md);padding:32px 24px;text-align:center}
    .brand-mark{width:96px;height:96px;border-radius:24px;object-fit:cover;box-shadow:var(--sh);margin-bottom:16px}
    h1{font-size:1.65rem;line-height:1.25;margin:0 0 10px;font-weight:800}
    .lead{color:var(--muted);font-size:1.05rem;line-height:1.65;margin:0 auto 24px;max-width:34ch}
    .line-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;font-size:1.08rem;font-weight:700;transition:var(--tr)}
    .line-button:hover{background:var(--pk);transform:translateY(-1px)}
    .line-button svg{width:22px;height:22px;fill:currentColor}
    .back-link{display:inline-block;margin-top:18px;color:var(--muted);font-size:.95rem;text-decoration:none}
    .back-link:hover{color:var(--pk)}
    .note{margin:22px 0 0;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:.88rem;line-height:1.55}
  </style>
</head>
<body>
  <main class="contact-card" aria-labelledby="contact-title">
    <img class="brand-mark" src="logo.png?v=2" alt="โลโก้ ClassKru">
    <h1 id="contact-title">ติดต่อ ClassKru ผ่าน LINE</h1>
    <p class="lead">สอบถาม แจ้งปัญหา หรือขอคำแนะนำการใช้งานได้โดยตรงผ่าน LINE Official Account</p>
    <a class="line-button" href="https://lin.ee/ttXzARG" rel="noopener" target="_blank">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 11.2c0 4.1-4 7.5-8.9 7.5-1 0-2-.1-2.9-.4L5 20.2l.7-3.2C4 15.6 3 13.5 3 11.2c0-4.1 4-7.5 8.9-7.5s8.8 3.4 8.8 7.5Zm-11.8-1H7.4v4.3h1.5v-4.3Zm2.9 0H10.4v4.3h1.4v-2.1c0-.6.3-1 .8-1s.7.4.7 1v2.1h1.5v-2.6c0-1.2-.6-1.9-1.6-1.9-.6 0-1.1.3-1.4.7v-.5Zm4.4 0h-1.5v4.3h1.5v-4.3Z"/></svg>
      เพิ่มเพื่อน LINE ClassKru
    </a>
    <a class="back-link" href="home.html">กลับหน้า ClassKru</a>
    <p class="note">เมื่อเปิดลิงก์แล้ว กด “เพิ่มเพื่อน” เพื่อเริ่มแชทกับทีมงาน</p>
  </main>
</body>
</html>
