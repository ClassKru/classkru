<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เช็คชื่อด้วย QR | ClassKru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --primary:#1d9e75;--pk:#0f6e56;--pbg:#f0fdf4;--pbd:#86efac;
      --bg:#f5f7fa;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e8edf2;
      --sh:0 1px 4px rgba(0,0,0,.06);--sh-md:0 4px 16px rgba(0,0,0,.10);
      --tr:all .18s cubic-bezier(.4,0,.2,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    .page{min-height:100vh;display:grid;place-items:center;padding:18px}
    .phone{width:min(430px,100%)}
    .head{padding:22px 20px;border-radius:24px 24px 0 0;background:var(--primary);color:var(--card)}
    .head h1{margin:0;font-size:1.25rem}
    .head p{margin:5px 0 0;font-weight:700;opacity:.9}
    .card{padding:18px;border:1px solid var(--border);border-radius:0 0 24px 24px;background:var(--card);box-shadow:var(--sh-md)}
    .room{padding:12px 14px;margin-bottom:14px;border:1px solid var(--pbd);border-radius:16px;background:var(--pbg);color:var(--pk);font-weight:800;line-height:1.5}
    label{display:grid;gap:7px;margin-bottom:12px;color:var(--muted);font-size:.82rem;font-weight:800}
    select,input{width:100%;min-height:46px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);padding:10px 12px;outline:none}
    select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--pbg)}
    .btn{width:100%;min-height:48px;border:1px solid var(--primary);border-radius:16px;background:var(--primary);color:var(--card);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .status{min-height:22px;margin-top:12px;color:var(--muted);font-weight:700;line-height:1.5;text-align:center}
    .success{display:none;text-align:center;padding:18px 8px 8px}
    .success i{font-size:3rem;color:var(--primary)}
    .success h2{margin:10px 0 4px;font-size:1.2rem}
    .success p{margin:0;color:var(--muted);font-weight:700}
    .empty{padding:28px 8px;text-align:center;color:var(--muted);font-weight:800;line-height:1.6}
  </style>
</head>
<body>
  <main class="page">
    <div class="phone">
      <div class="head">
        <h1>เช็คชื่อด้วย QR</h1>
        <p>เลือกชื่อของตัวเอง แล้วกดยืนยันเข้าเรียน</p>
      </div>
      <section class="card">
        <div class="room" id="room-label">กำลังโหลดห้องเรียน...</div>
        <form id="qr-form">
          <label>
            ชื่อนักเรียน
            <select id="student-select" required></select>
          </label>
          <label>
            รหัส/เลขที่ยืนยันตัวตน <span style="font-weight:600;color:var(--muted);">(ถ้าครูมีข้อมูลไว้)</span>
            <input id="student-code" autocomplete="off" inputmode="text" placeholder="เช่น เลขที่ หรือรหัสนักเรียน">
          </label>
          <button class="btn" id="submit-btn" type="submit"><i class="hgi-stroke hgi-tick-02"></i> ยืนยันว่าเข้าเรียน</button>
          <div class="status" id="status"></div>
        </form>
        <div class="success" id="success">
          <i class="hgi-stroke hgi-checkmark-circle-02"></i>
          <h2>เช็คชื่อเรียบร้อย</h2>
          <p id="success-text">ระบบส่งชื่อให้ครูแล้ว</p>
        </div>
      </section>
    </div>
  </main>
  <script>
    const SB_URL = 'https://dzntiiuyqvkaxqpqzxeh.supabase.co';
    const SB_KEY = 'sb_publishable_SePLBF-dsJfx5T6Yvvcuew_vntSr3Vc';
    const qs = new URLSearchParams(location.search);
    const code = (qs.get('code') || '').trim().toUpperCase();
    const client = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
    let session = null;

    const statusEl = document.getElementById('status');
    const roomEl = document.getElementById('room-label');
    const selectEl = document.getElementById('student-select');
    const codeEl = document.getElementById('student-code');
    const btnEl = document.getElementById('submit-btn');

    function setStatus(text, ok) {
      statusEl.textContent = text || '';
      statusEl.style.color = ok ? 'var(--primary)' : '#ef4444';
    }

    function renderEmpty(text) {
      document.getElementById('qr-form').innerHTML = `<div class="empty">${text}</div>`;
    }

    function getReadableError(err, fallback) {
      const msg = String(err?.message || '');
      const code = String(err?.code || '');
      if (code === '42883' || /function .* does not exist|could not find the function/i.test(msg)) return 'ระบบ QR ยังไม่ได้เปิดใช้งานบน Supabase';
      if (code === '42501' || /permission denied|not authorized|execute/i.test(msg)) return 'ระบบ QR ยังไม่ได้รับสิทธิ์ใช้งาน กรุณาแจ้งครูให้ตรวจ Supabase';
      if (/QR not found or closed|activity not found|closed/i.test(msg)) return 'QR นี้หมดอายุหรือถูกปิดแล้ว';
      if (/student not found/i.test(msg)) return 'ชื่อนี้ไม่อยู่ใน QR ห้องนี้ กรุณาสแกนใหม่';
      if (/เลขที่หรือรหัสนักเรียนไม่ตรง/i.test(msg)) return 'เลขที่หรือรหัสนักเรียนไม่ตรงกับรายชื่อ';
      if (/failed to fetch|networkerror|load failed|timeout/i.test(msg)) return 'เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
      return msg || fallback;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    async function rpc(name, args) {
      const { data, error } = await client.rpc(name, args);
      if (error) throw error;
      return data;
    }

    async function loadSession() {
      if (!client) { renderEmpty('เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่อีกครั้ง'); return; }
      if (!code) { renderEmpty('ไม่พบรหัส QR กรุณาสแกนใหม่'); return; }
      try {
        session = await rpc('attendance_qr_get_session', { p_code: code });
        if (!session || !session.code) { renderEmpty('QR นี้หมดอายุหรือถูกปิดแล้ว'); return; }
        roomEl.textContent = `${session.roomLabel || 'ห้องเรียน'} · วันที่ ${session.dateKey}`;
        const roster = Array.isArray(session.roster) ? session.roster : [];
        if (roster.length === 0) { renderEmpty('ยังไม่มีรายชื่อนักเรียนในห้องนี้'); return; }
        selectEl.innerHTML = '<option value="">เลือกชื่อของตัวเอง</option>' + roster.map(s => {
          const meta = [s.studentNo ? `เลขที่ ${s.studentNo}` : '', s.studentCode || ''].filter(Boolean).join(' · ');
          return `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}${meta ? ' (' + escapeHtml(meta) + ')' : ''}</option>`;
        }).join('');
        setStatus('', true);
      } catch (err) {
        console.warn(err);
        renderEmpty(getReadableError(err, 'โหลด QR ไม่สำเร็จ กรุณาสแกนใหม่'));
      }
    }

    document.getElementById('qr-form').addEventListener('submit', async event => {
      event.preventDefault();
      const studentId = selectEl.value;
      if (!studentId) { setStatus('กรุณาเลือกชื่อก่อน', false); return; }
      btnEl.disabled = true;
      setStatus('กำลังส่งชื่อให้ครู...', true);
      try {
        const result = await rpc('attendance_qr_mark_present', {
          p_code: code,
          p_student_id: studentId,
          p_identity: codeEl.value.trim()
        });
        document.getElementById('qr-form').style.display = 'none';
        document.getElementById('success').style.display = 'block';
        document.getElementById('success-text').textContent = result && result.studentName ? `${result.studentName} เช็คชื่อแล้ว` : 'ระบบส่งชื่อให้ครูแล้ว';
      } catch (err) {
        console.warn(err);
        setStatus(getReadableError(err, 'เช็คชื่อไม่สำเร็จ'), false);
        btnEl.disabled = false;
      }
    });

    loadSession();
  </script>
</body>
</html>
